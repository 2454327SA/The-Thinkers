<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Digital Wallet - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-md mx-auto animate-fade-in-up">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="bg-white rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-graduation-cap text-4xl text-purple-600"></i>
                </div>
                <h1 class="text-4xl font-bold text-white mb-2">Student Wallet</h1>
                <p class="text-purple-200">Smart Digital ID for Students</p>
            </div>
            
            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="flex mb-6 border-b">
                    <button id="loginTab" class="flex-1 py-3 text-center font-semibold text-purple-600 border-b-2 border-purple-600 transition">
                        Login
                    </button>
                    <button id="registerTab" class="flex-1 py-3 text-center font-semibold text-gray-500 hover:text-purple-600 transition">
                        Register
                    </button>
                </div>
                
                <!-- Login Form -->
                <div id="loginForm">
                    <form id="loginFormElement">
                        <div class="mb-4">
                            <label for="loginEmail" class="block text-gray-700 text-sm font-bold mb-2">
                                <i class="fas fa-envelope mr-2"></i>Email Address
                            </label>
                            <input type="email" id="loginEmail" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                        </div>
                        
                        <div class="mb-4">
                            <label for="loginPassword" class="block text-gray-700 text-sm font-bold mb-2">
                                <i class="fas fa-lock mr-2"></i>Password
                            </label>
                            <input type="password" id="loginPassword" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                        </div>
                        
                        <div class="flex items-center justify-between mb-6">
                            <label class="flex items-center" for="rememberMe">
                                <input type="checkbox" id="rememberMe" class="mr-2 rounded text-purple-600">
                                <span class="text-sm text-gray-600">Remember me</span>
                            </label>
                            <a href="#" class="text-sm text-purple-600 hover:text-purple-800">Forgot password?</a>
                        </div>
                        
                        <button type="submit" 
                                class="w-full gradient-bg text-white font-bold py-3 rounded-lg hover:opacity-90 transition transform hover:scale-105">
                            <i class="fas fa-sign-in-alt mr-2"></i>Login
                        </button>
                    </form>
                </div>
                
                <!-- Register Form -->
                <div id="registerForm" style="display: none;">
                    <form id="registerFormElement">
                        <div class="mb-3">
                            <label for="regName" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                            <input type="text" id="regName" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        
                        <div class="mb-3">
                            <label for="regEmail" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                            <input type="email" id="regEmail" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        
                        <div class="mb-3">
                            <label for="regStudentId" class="block text-gray-700 text-sm font-bold mb-2">Student ID</label>
                            <input type="text" id="regStudentId" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        
                        <div class="mb-4">
                            <label for="regPassword" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                            <input type="password" id="regPassword" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        
                        <button type="submit" 
                                class="w-full gradient-bg text-white font-bold py-3 rounded-lg hover:opacity-90 transition">
                            <i class="fas fa-user-plus mr-2"></i>Register
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Demo Credentials -->
            <div class="mt-6 text-center text-white text-sm">
                <p class="opacity-80">University of Wolverhampton</p>
                <p>Wulfruna Street, Wolverhampton,WV1 1LY</p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
