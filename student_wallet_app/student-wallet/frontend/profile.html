<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-graduation-cap text-2xl"></i>
                    <span class="font-bold text-xl">Student Wallet</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="dashboard.html" class="hover:text-purple-200 transition">Dashboard</a>
                    <a href="digital-id.html" class="hover:text-purple-200 transition">Digital ID</a>
                    <a href="profile.html" class="hover:text-purple-200 transition">Profile</a>
                    <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto px-6 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">
                    <i class="fas fa-user-circle text-purple-600 mr-2"></i>My Profile
                </h1>
                
                <form id="profileForm">
                    <div class="mb-4">
                        <label for="profileName" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                        <input type="text" id="profileName" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <div class="mb-4">
                        <label for="profileEmail" class="block text-gray-700 font-semibold mb-2">Email</label>
                        <input type="email" id="profileEmail" class="w-full px-4 py-2 border rounded-lg bg-gray-100" readonly>
                    </div>
                    
                    <div class="mb-4">
                        <label for="profileStudentId" class="block text-gray-700 font-semibold mb-2">Student ID</label>
                        <input type="text" id="profileStudentId" class="w-full px-4 py-2 border rounded-lg bg-gray-100" readonly>
                    </div>
                    
                    <div class="mb-4">
                        <label for="profilePhone" class="block text-gray-700 font-semibold mb-2">Phone Number</label>
                        <input type="tel" id="profilePhone" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                    </div>
                    
                    <div class="mb-4">
                        <label for="profileDepartment" class="block text-gray-700 font-semibold mb-2">Department</label>
                        <select id="profileDepartment" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                            <option>Computer Science</option>
                            <option>Business Administration</option>
                            <option>Engineering</option>
                            <option>Mathematics</option>
                        </select>
                    </div>
                    
                    <div class="mb-6">
                        <label for="profileSemester" class="block text-gray-700 font-semibold mb-2">Semester</label>
                        <select id="profileSemester" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                            <option>1</option><option>2</option><option>3</option>
                            <option>4</option><option>5</option><option>6</option>
                            <option>7</option><option>8</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="w-full gradient-bg text-white font-bold py-3 rounded-lg hover:opacity-90 transition">
                        <i class="fas fa-save mr-2"></i>Update Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/profile.js"></script>
</body>
</html>
